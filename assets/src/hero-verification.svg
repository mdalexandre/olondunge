<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Olondunge blind verification">
  <title>Blind verification</title>
  <desc>A produced artifact crossing a veil of light: the verifier on the far side, in its own
  session, receives the artifact, the original inputs and the criteria, and a candidate that
  carries the producer's verdict is refused.</desc>
  <defs>
    <filter id="bloom" x="-75%" y="-75%" width="250%" height="250%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="tight"/>
      <feMerge><feMergeNode in="wide"/><feMergeNode in="tight"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="beamGlow" x="-40%" y="-140%" width="180%" height="380%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="tight"/>
      <feMerge><feMergeNode in="wide"/><feMergeNode in="tight"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="veil" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" result="warp"/>
      <feGaussianBlur in="warp" stdDeviation="3"/>
    </filter>
    <linearGradient id="veilTint" x1="766" y1="0" x2="836" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#EDEAFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="aurora" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="45%" r="78%">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#05050C"/>
