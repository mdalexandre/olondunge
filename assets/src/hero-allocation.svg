<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Olondunge allocation">
  <title>Allocation</title>
  <desc>One seed sending work outward along four lanes, with a dashed path bringing the result
  back for a blind check.</desc>
  <defs>
    <radialGradient id="seed" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#EADCFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </radialGradient>
    <filter id="bloom" x="-75%" y="-75%" width="250%" height="250%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="tight"/>
      <feMerge><feMergeNode in="wide"/><feMergeNode in="tight"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="beamGlow" x="-40%" y="-140%" width="180%" height="380%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="tight"/>
      <feMerge><feMergeNode in="wide"/><feMergeNode in="tight"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="seedHalo" x="-150%" y="-150%" width="400%" height="400%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="9" result="soft"/>
      <feFlood flood-color="#8B5CF6" flood-opacity="0.9" result="tint"/>
      <feComposite in="tint" in2="soft" operator="in" result="ring"/>
      <feMerge><feMergeNode in="ring"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="seedGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="aurora" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
    <marker id="returnHead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#EDEAFF" fill-opacity="0.8"/>
    </marker>
    <radialGradient id="vignette" cx="50%" cy="45%" r="78%">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#05050C"/>
