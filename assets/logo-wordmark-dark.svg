<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="1060" height="300" role="img" aria-label="Olondunge">
  <title>Olondunge</title>
  <defs>
    
    <radialGradient id="seed" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#EADCFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </radialGradient>
    <linearGradient id="lane0" x1="128.0" y1="107.0" x2="214.66" y2="112.72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="lane1" x1="146.19" y1="138.5" x2="97.9" y2="210.69" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="lane2" x1="109.81" y1="138.5" x2="71.43" y2="60.59" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8ABF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FF5FA2"/>
      <stop offset="1" stop-color="#FF8ABF"/>
    </linearGradient>
    <filter id="bloom" x="-75%" y="-75%" width="250%" height="250%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="tight"/>
      <feMerge><feMergeNode in="wide"/><feMergeNode in="tight"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="seedHalo" x="-120%" y="-120%" width="340%" height="340%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="7" result="soft"/>
      <feFlood flood-color="#8B5CF6" flood-opacity="0.9" result="tint"/>
      <feComposite in="tint" in2="soft" operator="in" result="ring"/>
      <feMerge><feMergeNode in="ring"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(18 22) scale(0.9)">
    <g filter="url(#bloom)">
    <circle cx="128" cy="128" r="112" fill="none" stroke="#8B5CF6" stroke-opacity="0.34" stroke-width="2.2" stroke-dasharray="2 9" stroke-linecap="round"/>
    <path d="M 128 107 C 136.35 83.06 184.59 74.31 214.66 112.72" fill="none" stroke="url(#lane0)" stroke-width="15" stroke-linecap="round"/>
    <path d="M 146.19 138.5 C 162.75 157.7 146.2 203.86 97.9 210.69" fill="none" stroke="url(#lane1)" stroke-width="15" stroke-linecap="round"/>
    <path d="M 109.81 138.5 C 84.91 143.24 53.2 105.84 71.43 60.59" fill="none" stroke="url(#lane2)" stroke-width="15" stroke-linecap="round"/>
    <circle cx="214.66" cy="112.72" r="11.5" fill="#8B5CF6"/>
    <circle cx="214.66" cy="112.72" r="3.68" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="97.9" cy="210.69" r="11.5" fill="#22D3EE"/>
    <circle cx="97.9" cy="210.69" r="3.68" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="71.43" cy="60.59" r="11.5" fill="#FF5FA2"/>
    <circle cx="71.43" cy="60.59" r="3.68" fill="#FFFFFF" opacity="0.85"/>
  </g>
  <g filter="url(#seedHalo)">
    <circle cx="128" cy="128" r="18" fill="url(#seed)"/>
    <circle cx="128" cy="128" r="6.12" fill="#FFFFFF"/>
  </g>
  </g>
  <g font-family="Fira Sans, Inter, DejaVu Sans, sans-serif">
    <text x="288" y="168" font-size="118" font-weight="500" letter-spacing="1"
          fill="#EDEAFF">olondunge</text>
    <text x="292" y="226" font-size="33" font-weight="400" letter-spacing="7"
          fill="#A9A3D6">one model, many minds</text>
  </g>
</svg>
